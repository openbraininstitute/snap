[base]
name = bluepysnap

[tox]
envlist =
    lint
    py{311,312,313,314}

[testenv]
deps =
    pytest
    pytest-cov

extras =
    plots
    indexing

package = wheel
wheel_build_env = .pkg
setenv =
    MPLBACKEND = Agg
commands = pytest --cov={[base]name} --cov-report term-missing --cov-fail-under=100 --cov-report=xml {posargs:tests}

[testenv:lint]
deps =
    ruff
commands =
	python -m ruff format --check
	python -m ruff check

[testenv:format]
skip_install = true
deps =
    ruff
commands =
	python -m ruff format

[testenv:typecheck]
deps =
    ty==0.0.95
    pandas-stubs
    pytest
extras =
    plots
    indexing
commands =
    ty check {posargs:src}

[testenv:docs]
changedir = doc
extras = docs
commands =
    make clean
    make html SPHINXOPTS=-W
allowlist_externals = make

[gh-actions]
python =
  3.11: py311, lint, typecheck, docs
  3.12: py312
  3.13: py313
  3.14: py314

[pytest]
filterwarnings =
    # ignoring the warning about Simulation node sets overwriting Circuit node sets in tests
    ignore:Simulation node sets overwrite:RuntimeWarning:bluepysnap
