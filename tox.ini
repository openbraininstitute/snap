[base]
name = bluepysnap

[tox]
# tox-uv is needed for uv_resolution in the py311-oldest env
requires =
    tox>=4
    tox-uv>=1
# tox-gh-actions only runs the envs listed here, filtered by the [gh-actions] mapping
envlist =
    lint
    typecheck
    docs
    py{311,312,313,314}
    py311-oldest

[testenv]
deps =
    pytest
    pytest-cov

extras =
    plots
    indexing

package = wheel
wheel_build_env = .pkg
setenv =
    MPLBACKEND = Agg
commands = pytest --cov={[base]name} --cov-report term-missing --cov-fail-under=100 --cov-report=xml {posargs:tests}

[testenv:py311-oldest]
description = run the tests with the oldest supported versions of the direct dependencies
uv_resolution = lowest-direct
deps =
    pytest>=8
    pytest-cov>=6

[testenv:lint]
deps =
    ruff
commands =
	python -m ruff format --check
	python -m ruff check

[testenv:format]
skip_install = true
deps =
    ruff
commands =
	python -m ruff format

[testenv:typecheck]
deps =
    ty==0.0.95
    pandas-stubs
    pytest
extras =
    plots
    indexing
commands =
    ty check {posargs:src}

[testenv:docs]
changedir = doc
extras = docs
commands =
    make clean
    make html SPHINXOPTS=-W
allowlist_externals = make

[gh-actions]
python =
  3.11: py311, py311-oldest, lint, typecheck, docs
  3.12: py312
  3.13: py313
  3.14: py314

[pytest]
filterwarnings =
    # fail on deprecations, to detect early the breaking changes in the dependencies
    error::DeprecationWarning
    error::FutureWarning
    # ignoring the warning about Simulation node sets overwriting Circuit node sets in tests
    ignore:Simulation node sets overwrite:RuntimeWarning:bluepysnap
