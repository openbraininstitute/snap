[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bluepysnap"
dynamic = ["version"]
description = "Simulation and Neural network Analysis Productivity layer"
authors = [
    {name = "Open Brain Institute"},
    {name = "Blue Brain Project, EPFL"},
]
dependencies = [
    "h5py>=3.0.1,<4.0.0",
    "importlib_resources>=5.0.0",
    "jsonschema>=4.18.0,<5.0.0",
    "libsonata>=0.1.24,<1.0.0",
    "morphio>=3.3.5,<4.0.0",
    "morph-tool>=2.4.3,<3.0.0",
    "numpy>=1.8",
    "pandas>=1.0.0",
    "click>=7.0",
    "more-itertools>=8.2.0",
    "referencing",
]
requires-python = ">=3.11"
readme = "README.rst"
license = "LGPL-3.0"

[project.urls]
Homepage = "https://github.com/openbraininstitute/snap"
Repository = "https://github.com/openbraininstitute/snap"
Documentation = "https://bluebrainsnap.readthedocs.io/"
Changelog = "https://github.com/openbraininstitute/snap/releases"
Tracker = "https://github.com/openbraininstitute/snap/issues"

[project.scripts]
bluepysnap = "bluepysnap.cli:cli"

[project.optional-dependencies]
docs = ["sphinx>=8.2,<10", "obi-sphinx-theme>=2.0.0"]
plots = ["matplotlib>=3.0.0"]
indexing = ["brain-indexer>=3.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/bluepysnap/_version.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # bugbear
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "S", # bandit
    "UP", # pyupgrade
]
ignore = [
    "S101", # allow `assert`
    "E731", # Do not assign a `lambda` expression, use a `def`
    "E741", # Ambiguous variable name: `l`
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "ANN",     # Missing type annotation
    "D",       # pydocstyle
    "ERA001",  # Found commented-out code
    "INP001",  # Missing `__init__.py`
    "PLC2701", # Private name import from external module
    "PLR2004", # magic value (constant) used in comparison (i.e. expected == 3)
    "S101",    # Use of `assert` detected
    "S106",    # Magic value
    "SIM117",  # Use a single `with` statement with multiple contexts
    "SLF001",  # private member access
    "B018",    # Found useless expression. Either assign it to a variable or remove it.
    "S108",    # Probable insecure usage of temporary file or directory
    "E501",    # Line too long
]
"doc/source/notebooks/*.ipynb" = [
    "E501", # Line too long
    "B905", # `zip()` without an explicit `strict=` parameter
    "D103", # Missing docstring in public function
    "S310", # Audit URL open for permitted schemes.
]

[tool.ruff.lint.pylint]
# Maximum number of arguments for function / method
max-args = 12
# Maximum number of locals for function / method body
max-locals = 15
# Maximum number of return / yield for function / method body
max-returns = 6
# Maximum number of branch for function / method body
max-branches = 12
# Maximum number of statements in function / method body
max-statements = 50
# Maximum number of public methods for a class (see R0904).
max-public-methods = 60

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true
# Set the line length limit used when formatting code snippets in
# docstrings.
docstring-code-line-length = 100
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

[tool.coverage.run]
source_pkgs = ["bluepysnap"]
omit = [
    "*/bluepysnap/_version.py",
]

[tool.coverage.paths]
# Map the wheel's site-packages path back to src for coverage/codecov.
source = [
    "src/bluepysnap",
    "*/site-packages/bluepysnap",
]
